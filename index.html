<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Simple Bank</title>

        <link rel="stylesheet" href="style.css">
        
    </head>
    <body>
        <main>

            <!-- ========== PAGE HEADER ========== -->
            <h1>Simple Bank</h1>
            <p class="sub">Create accounts, move money, and take a 10,000 KES loan. Data is saved in this browser only.</p>

            <!-- Status message area: the JS say() function writes success (green) and error (red) messages here -->
            <p id="msg" role="status" aria-live="polite"></p>

            <!-- ========== ACTION FORMS (one card per banking function) ========== -->

            <div class="grid">

                <!-- Function 1: Create a bank account -->
                <section><h2>Create account</h2>
                    <form id="fNew">
                        <label for="nName">Account holder</label>
                        <input id="nName" required>
                        <label for="nOpen">Opening deposit (KES)</label>
                        <input id="nOpen" type="number" min="0" step="0.01" value="0">
                        <button>Create account</button>
                    </form>
                </section>

                <!-- Function 2: Deposit funds (the account dropdown is filled by render()) -->
                <section><h2>Deposit</h2>
                    <form id="fDep">
                        <label for="dAcc">Account</label>
                        <select id="dAcc"></select>
                        <label for="dAmt">Amount (KES)</label>
                        <input id="dAmt" type="number" min="0.01" step="0.01" required>
                        <button>Deposit</button>
                    </form>
                </section>

                <!-- Function 3: Withdraw funds -->
                <section><h2>Withdraw</h2>
                    <form id="fWd">
                        <label for="wAcc">Account</label>
                        <select id="wAcc"></select>
                        <label for="wAmt">Amount (KES)</label>
                        <input id="wAmt" type="number" min="0.01" step="0.01" required>
                        <button>Withdraw</button>
                    </form>
                </section>

                <!-- Function 4: Transfer funds between two accounts -->
                <section><h2>Transfer</h2>
                    <form id="fTr"><label for="tFrom">From</label>
                        <select id="tFrom"></select>
                        <label for="tTo">To</label>
                        <select id="tTo"></select>
                        <label for="tAmt">Amount (KES)</label>
                        <input id="tAmt" type="number" min="0.01" step="0.01" required>
                        <button>Transfer</button>
                    </form>
                </section>
            </div>

            <!-- ========== ACCOUNT LIST ========== -->

            <!-- Function 5 (Delete dormant account) and the bonus loan button live on each account row.
                The rows themselves are generated by render() in the script below. -->
            <section class="gap-top">
                    <h2>Accounts</h2>
                <!-- Dormancy setting: an account can only be deleted after this many days without activity.
                    Set it to 0 to test deletion. -->
                <div class="dorm">
                    <label for="dorm">Dormant after (days without activity)</label>
                    <input id="dorm" type="number" min="0" step="1">
                </div>
                <div id="list"></div>
            </section>

            <!-- ========== ACTIVITY LOG ========== -->
            <!-- Table body is filled by render() with the 30 most recent transactions -->
            <section>
                    <h2>Recent activity</h2>
                    <div class="wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>Time</th>
                                    <th>Account</th>
                                    <th>Type</th>
                                    <th>Amount</th>
                                    <th>Note</th>
                                </tr>
                            </thead>
                            <tbody id="log"></tbody>
                        </table>
                    </div>
            </section>
        </main>
<script src="script.js"></script>

    </body>
</html>
